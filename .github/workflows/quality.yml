# The checks of what the documents promise about themselves and the version (scripts/quality.mjs),
# the build of the packages, and every test: the checks' and the packages'. The job is named
# Quality, the status check the ruleset `main` requires, so it covers the code as well as the documents.
name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-26.04
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Show the image
        run: cat /etc/os-release; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is not on the PATH until Corepack is enabled, so setup-node cannot cache its store.
          package-manager-cache: false
      - name: Enable the pnpm pinned in package.json
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check the documents and the version
        run: pnpm run quality
      - name: Build the packages
        run: pnpm -r build
      - name: Check what each package ships
        run: node scripts/pack-check.mjs
      - name: Type-check the packages and their tests
        run: pnpm -r typecheck
      - name: Test the checks and the packages
        run: pnpm test
      - name: Decide as Release does
        run: node scripts/release.mjs "$RUNNER_TEMP/notes.md"
      - name: Write an annotated tag locally, as Release does, without pushing it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'notes\n' > "$RUNNER_TEMP/n.md"
          git tag --annotate --cleanup=verbatim v0.0.0-probe --message v0.0.0-probe --message "$(cat "$RUNNER_TEMP/n.md")" "$GITHUB_SHA"
          git cat-file -t v0.0.0-probe
      - name: Pack each package as Release publishes it
        run: node scripts/publish.mjs skip v0.8.3 --dry-run
