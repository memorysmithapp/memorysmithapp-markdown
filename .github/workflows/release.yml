# Tags and publishes a version once its bump is merged, so that nobody tags or publishes by hand
# (scripts/release.mjs decides the tag, scripts/publish.mjs what reaches npm; SDLC.md §10
# describes the flow). Uses only the workflow's GITHUB_TOKEN and its OIDC identity, which npm
# trusted publishing takes in place of a token, and no stored secret.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # The OIDC token npm trusted publishing exchanges for the right to publish, with provenance.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm is not on the PATH until Corepack is enabled, so setup-node cannot cache its store.
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Decide
        id: plan
        run: node scripts/release.mjs "$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
      - name: Write the annotated tag on the merged commit
        if: steps.plan.outputs.action == 'release'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --cleanup=verbatim "$TAG" --message "$TAG" --message "$(cat "$RUNNER_TEMP/notes.md")" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Create the GitHub Release
        if: steps.plan.outputs.action == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Build the packages
        if: steps.plan.outputs.action == 'release' || steps.plan.outputs.action == 'tagged'
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter "./packages/**" build
      - name: Publish the packages to npm
        if: steps.plan.outputs.action == 'release' || steps.plan.outputs.action == 'tagged'
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: node scripts/publish.mjs "$ACTION" "$TAG"
